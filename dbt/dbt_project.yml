name: 'dbt_from_raw_csv'
version: '1.0.0'
config-version: 2

profile: 'dbt_from_raw_csv'

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Raw CSV folders. These stand in for a bucket (S3 / GCS / Azure) that holds
  # the source-system extracts. Point them at a different folder to read
  # another copy of the data. The SQL does not change.
  raw_stripe_dir: "raw/stripe_outputs"
  raw_marketing_dir: "raw/marketing_outputs"
  # Landing folder for the two CSVs handed off to dbt_to_exports.
  # Never touched by `dbt clean`.
  export_dir: "exports"
  # CLV is measured over the first N lifetime months (0 to N-1).
  # Keep in sync with CLV_HORIZON_MONTHS in saas_kpi_engine.py and the generator.
  clv_horizon_months: 24

models:
  dbt_from_raw_csv:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Tables, not views, so the big Stripe invoice CSV is read once
      # instead of once per downstream model.
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
